<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">

    <title>Create Account - RoadCare</title>
</head>

<body class="auth-body">

    <div class="auth-card">

        <!-- Heading -->
        <h1 class="auth-title">Create Account</h1>

        <p class="auth-subtitle">
            Join RoadCare and help make roads safer.
        </p>


        <!-- Registration Illustration -->
        <img
            src="Login (1).gif"
            alt="Create account illustration"
            class="auth-illustration"
        >


        <!-- Registration Form -->
        <form class="auth-form" id="registerForm">

            <!-- Full Name -->
            <div class="input-label">
                Full Name
            </div>

            <div class="input-group">

                <span class="input-icon">👤</span>

                <input
                    type="text"
                    id="reg-name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Phone Number -->
            <div class="input-label">
                Phone Number
            </div>

            <div class="input-group">

                <span class="input-icon">📱</span>

                <input
                    type="tel"
                    id="reg-phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <!-- Email -->
            <div class="input-label">
                Email Address
            </div>

            <div class="input-group">

                <span class="input-icon">✉️</span>

                <input
                    type="email"
                    id="reg-email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <!-- Password -->
            <div class="input-label">
                Password
            </div>

            <div class="input-group">

                <span class="input-icon">🔒</span>

                <input
                    type="password"
                    id="reg-password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="toggle-eye"
                    onclick="togglePassword('reg-password', this)"
                >
                    👁️
                </button>

            </div>


            <!-- Confirm Password -->
            <div class="input-label">
                Confirm Password
            </div>

            <div class="input-group">

                <span class="input-icon">🔒</span>

                <input
                    type="password"
                    id="reg-confirm-password"
                    placeholder="Re-enter your password"
                    required
                >

                <button
                    type="button"
                    class="toggle-eye"
                    onclick="togglePassword('reg-confirm-password', this)"
                >
                    👁️
                </button>

            </div>


            <!-- Create Account Button -->
            <button
                type="submit"
                class="auth-btn"
            >
                🚀 Create Account
            </button>

        </form>


        <!-- Login Section -->
        <div class="login-area">

            <span>
                Already have an account?
            </span>

            <button
                type="button"
                class="login-btn"
                onclick="window.location.href='login.html'"
            >
                Login <span class="login-arrow">→</span>
            </button>

        </div>

    </div>


    <!-- Footer -->
    <p class="auth-footer">
        &copy; 2026 RoadCare Platform by Samiksha.
        All Rights Reserved.
    </p>


    <!-- Registration JavaScript -->
    <script src="register.js"></script>

</body>

</html>

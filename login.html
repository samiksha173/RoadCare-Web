<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">

    <title>Login - RoadCare</title>
</head>

<body class="auth-body">

    <div class="auth-card">

        <h1 class="auth-title">Welcome Back</h1>

        <p class="auth-subtitle">
            Log in to continue reporting and tracking road issues.
        </p>

        <img src="lottie1.gif"
             alt="Login illustration"
             class="auth-illustration">


        <!-- LOGIN FORM -->
        <form class="auth-form" id="loginForm">

            <!-- EMAIL -->
            <div class="input-label">
                Email Address
            </div>

            <div class="input-group">

                <span class="input-icon">✉️</span>

                <input
                    type="email"
                    id="login-email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="input-label">
                Password
            </div>

            <div class="input-group">

                <span class="input-icon">🔒</span>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="toggle-eye"
                    onclick="togglePassword('login-password', this)">
                    👁️
                </button>

            </div>


            <!-- REMEMBER / FORGOT -->
            <div class="auth-row">

                <label class="remember-me">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#" class="forgot-link" onclick="forgotPassword(event)">
                    Forgot password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="auth-btn">
                🔑 Login
            </button>

        </form>


        <!-- REGISTER LINK -->
        <p class="auth-switch">

            Don't have an account?

            <button
                type="button"
                class="create-btn"
                onclick="window.location.href='register.html'">
                Create one
            </button>

        </p>

        <!-- BACK TO ROLE SELECTION (added) -->
        <p class="auth-switch">
            <button
                type="button"
                class="create-btn"
                onclick="window.location.href='welcome.html'"
            >
                ← Back to role selection
            </button>
        </p>


        <!-- FOOTER -->
        <p class="auth-footer">
            &copy; 2026 RoadCare Platform by Samiksha.
            All Rights Reserved.
        </p>

    </div>


    <!-- LOGIN JAVASCRIPT -->
    <script src="login.js"></script>

</body>
</html>

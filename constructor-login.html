<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="constructor-auth.css">

    <title>Constructor Login - RoadCare</title>
</head>

<body class="auth-body">

    <div class="auth-card">

        <!-- LOTTIE ANIMATION -->
        <div id="lottie-box" class="auth-lottie" aria-hidden="true"></div>

        <h1 class="auth-title">Constructor Login</h1>

        <p class="auth-subtitle">
            Log in to view and manage road issue reports.
        </p>

        <!-- CONSTRUCTOR LOGIN FORM -->
        <form class="auth-form" id="constructorLoginForm">

            <!-- EMAIL -->
            <div class="input-label">
                Email Address
            </div>

            <div class="input-group">
                <span class="input-icon">✉️</span>
                <input
                    type="email"
                    id="con-login-email"
                    autocomplete="username"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <!-- PASSWORD -->
            <div class="input-label">
                Password
            </div>

            <div class="input-group">
                <span class="input-icon">🔒</span>
                <input
                    type="password"
                    id="con-login-password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >
                <button
                    type="button"
                    class="toggle-eye"
                    onclick="togglePassword('con-login-password', this)"
                >
                    👁️
                </button>
            </div>

            <!-- REMEMBER / FORGOT -->
            <div class="auth-row">
                <label class="remember-me">
                    <input type="checkbox" id="con-remember" checked>
                    Keep me signed in
                </label>
                <a href="#" class="forgot-link" id="con-forgot">Forgot password?</a>
            </div>

            <!-- MESSAGE (errors / success) -->
            <div id="auth-msg" class="auth-msg" role="alert" aria-live="polite"></div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="auth-btn">
                🔑 Login
            </button>

        </form>

        <!-- REGISTER LINK -->
        <p class="auth-switch">
            New constructor account?
            <button
                type="button"
                class="create-btn"
                onclick="window.location.href='constructor-register.html'"
            >
                Register here
            </button>
        </p>

        <p class="auth-switch">
            <button
                type="button"
                class="create-btn"
                onclick="window.location.href='welcome.html'"
            >
                ← Back to role selection
            </button>
        </p>

        <p class="auth-footer">
            &copy; 2026 RoadCare Platform by Samiksha.
            All Rights Reserved.
        </p>

    </div>

    <!-- Lottie library, then our animation, then the page logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="constructor-lottie.js"></script>
    <script src="auth-common.js"></script>
    <script src="constructor-auth.js"></script>

</body>
</html>
